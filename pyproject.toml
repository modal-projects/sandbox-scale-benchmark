[project]
name = "modal-burst"
version = "0.1.0"
description = "Modal sandbox creation and SQLite build benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["modal>=1.5"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
